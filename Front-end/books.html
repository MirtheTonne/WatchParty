<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
    <link rel="stylesheet" href="../Front-end/style.css" />
  </head>
  <body>
    <nav></nav>

    <main>
      <!-- Filter balk -->
      <div class="filters">
        <input type="text" id="search" placeholder="Search ..." />
        <select id="filter-genre">
          <option value="">All genres</option>
        </select>
      </div>

      <!-- Boekenkast -->
      <div class="bookshelf">
        <div class="shelf" id="books-shelf">
          <!-- Boeken komen hier -->
        </div>
      </div>
    </main>

    <!-- Add model -->
    <div id="add-modal" class="modal hidden">
      <div class="model-content">
        <button class="modal-close" id="add-modal-close">ﾒ</button>

        <h2>Add Book</h2>

        <input type="text" id="input-title" placeholder="Title" />
        <input
          type="text"
          id="input-authors"
          placeholder="Authors (comma separated)"
        />
        <input
          type="text"
          id="input-genre"
          placeholder="Genres (comma separated)"
        />
        <input type="number" id="input-year" placeholder="Year" />
        <input
          type="text"
          id="input-language"
          placeholder="Language (e.g. EN)"
        />
        <textarea
          id="input-opinion"
          placeholder="Opinion (optional)"
        ></textarea>
      </div>
    </div>
  </body>
</html>
